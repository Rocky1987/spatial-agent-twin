server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;
  types {
    application/wasm wasm;
    text/javascript mjs;
  }

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json application/wasm;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Stage 4 起，/api 轉給後端（compose 加上 backend 服務後再開啟）
  # location /api/ { proxy_pass http://backend:5000; }
}
