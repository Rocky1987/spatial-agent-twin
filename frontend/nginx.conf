server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # web-ifc 與 fragments worker 需要正確的 Content-Type，瀏覽器才肯用 streaming 方式載入 wasm / module worker
  include /etc/nginx/mime.types;
  types {
    application/wasm wasm;
    text/javascript mjs;
  }

  gzip on;
  gzip_types application/wasm application/json text/javascript text/css image/svg+xml application/octet-stream;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
  }

  # SignalR：WebSocket 需要升級標頭，長連線不能被 nginx 逾時切掉
  location /hubs/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
